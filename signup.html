<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ElectraPro Electrical Services</title>
  <meta name="description" content="Create your ElectraPro account to book services faster, track visits and get priority support.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="theme-color" content="#101C2C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script>
    /* Apply stored theme + direction before paint (no FOUC) */
    (function () {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('ep_theme') || 'dark'); } catch (e) {}
      try { document.documentElement.setAttribute('dir', localStorage.getItem('ep_dir') || 'ltr'); } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="auth-page" aria-label="Signup page">
    <div class="auth-wrap">
      <section class="auth-card" aria-labelledby="signup-heading">

        <a href="index.html" class="auth-brand" aria-label="ElectraPro Home">
          <span class="auth-brand__icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#101C2C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </span>
          <span class="auth-brand__text">
            <span class="auth-brand__name">ElectraPro</span>
            <span class="auth-brand__sub">Electrical Services</span>
          </span>
        </a>

        <h1 class="auth-title" id="signup-heading">Create Account</h1>
        <p class="auth-subtitle">Join ElectraPro for faster bookings and priority support.</p>

        <div class="auth-status" id="signup-status" role="status" aria-live="polite"></div>

        <form class="auth-form" id="signup-form" novalidate aria-label="Signup form">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name <span class="auth-required" aria-hidden="true">*</span></label>
            <input type="text" id="signup-name" name="name" class="form-control"
                   placeholder="John Smith" autocomplete="name" required
                   aria-describedby="signup-name-error">
            <div class="form-error" id="signup-name-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address <span class="auth-required" aria-hidden="true">*</span></label>
            <input type="email" id="signup-email" name="email" class="form-control"
                   placeholder="you@example.com" autocomplete="email" required
                   aria-describedby="signup-email-error">
            <div class="form-error" id="signup-email-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password <span class="auth-required" aria-hidden="true">*</span></label>
            <div class="auth-pass-wrap">
              <input type="password" id="signup-password" name="password" class="form-control"
                     placeholder="Minimum 6 characters" autocomplete="new-password" required
                     aria-describedby="signup-password-error">
              <button type="button" class="auth-pass-toggle" data-pass-toggle="signup-password"
                      aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div class="form-error" id="signup-password-error" role="alert"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm">Confirm Password <span class="auth-required" aria-hidden="true">*</span></label>
            <div class="auth-pass-wrap">
              <input type="password" id="signup-confirm" name="confirm" class="form-control"
                     placeholder="Re-enter your password" autocomplete="new-password" required
                     aria-describedby="signup-confirm-error">
              <button type="button" class="auth-pass-toggle" data-pass-toggle="signup-confirm"
                      aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div class="form-error" id="signup-confirm-error" role="alert"></div>
          </div>

          <label class="auth-terms" for="signup-terms">
            <input type="checkbox" id="signup-terms" name="terms">
            <span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</span>
          </label>

          <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
        </form>

        <div class="auth-divider" aria-hidden="true">or continue with</div>

        <div class="auth-social">
          <button type="button" class="auth-social-btn" data-social="Google" aria-label="Continue with Google">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
            Google
          </button>
          <button type="button" class="auth-social-btn" data-social="Facebook" aria-label="Continue with Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
            Facebook
          </button>
        </div>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
      </section>

      <div class="auth-back">
        <a href="index.html" aria-label="Back to home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Home
        </a>
      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
</body>
</html>
