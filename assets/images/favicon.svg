<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="electra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C978"/>
      <stop offset="100%" stop-color="#E6A23C"/>
    </linearGradient>
    <filter id="bolt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#101C2C" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Base Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#electra-grad)"/>
  <!-- Highlight Ring -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Lightning Bolt -->
  <g transform="translate(8, 8) scale(2)" filter="url(#bolt-shadow)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#101C2C" stroke="#101C2C" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
